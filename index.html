<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adding Integers Using Integer Chips</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="timer-scene.css">
</head>

<body class="ready">
  <div id="grid-bg" class="paper" aria-hidden="true"></div>
  <div id="wipe"></div>
  <div class="bar t"></div>
  <div class="bar b"></div>


  <section id="s1" class="slide">
    <div class="world">
      <div class="g paper"></div><canvas id="wave"></canvas>
      <div class="ttl"><span class="a">Adding</span><b class="b">INTEGERS</b><span class="c">using integer chips</span>
      </div>
      <div class="par"></div>
    </div>
    <div id="hero"></div>
  </section>

  <section id="deck" class="slide paper" aria-live="polite">
    <div id="deck-ribbon" aria-hidden="true"></div>
    <div id="deck-content"></div>
    <div class="deck-nav">
      <button id="deck-back">Back</button>
      <button id="deck-next" class="go">Next</button>
    </div>
  </section>

  <script src="script.js" defer></script>
  <script src="timer-scene.js" defer></script>
</body>

</html>
