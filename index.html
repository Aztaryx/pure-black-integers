<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adding Integers Using Integer Chips</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="ready">
  <div id="wipe"></div>
  <div class="bar t"></div>
  <div class="bar b"></div>


  <section id="s1" class="slide">
    <div class="world">
      <div class="g paper"></div><canvas id="wave"></canvas>
      <div class="ttl"><span class="a">Adding</span><b class="b">INTEGERS</b><span class="c">using integer chips</span>
      </div>
      <div class="par"></div>
    </div>
    <div id="hero"></div>
  </section>

  <section id="s2" class="slide paper">
    <span class="kicker">The Chip Mat</span>
    <div id="eq"></div>
    <div class="stage" id="stage">
      <div class="mat"></div>
    </div>
    <p id="cap" aria-live="polite"></p>
    <div class="ctl">
      <button id="bk">Back</button><button id="nx" class="go2">Next</button><span class="gap"></span>
      <span id="tabs" class="ctl"></span>
    </div>
  </section>

  <section id="deck" class="slide paper" aria-live="polite">
    <div id="deck-content"></div>
    <div class="deck-nav">
      <button id="deck-back">Back</button>
      <button id="deck-next" class="go">Next</button>
    </div>
  </section>

  <script src="script.js" defer></script>
</body>

</html>
